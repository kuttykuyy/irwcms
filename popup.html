<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>IRWCMS Auto-Fill</title>
  <style>
    body {
      width: 320px;
      padding: 15px;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
    }
    h3 {
      color: #1a73e8;
      margin: 0 0 15px 0;
      text-align: center;
    }
    .upload-area {
      border: 2px dashed #ccc;
      border-radius: 8px;
      padding: 20px;
      text-align: center;
      margin-bottom: 15px;
      background: white;
    }
    .upload-area:hover {
      border-color: #1a73e8;
    }
    input[type="file"] {
      display: none;
    }
    .upload-btn {
      background: #1a73e8;
      color: white;
      padding: 10px 20px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 14px;
    }
    .upload-btn:hover {
      background: #1557b0;
    }
    #fileName {
      margin-top: 10px;
      color: #666;
      font-size: 12px;
    }
    #fillBtn {
      width: 100%;
      background: #34a853;
      color: white;
      padding: 12px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px;
      font-weight: bold;
    }
    #fillBtn:hover {
      background: #2d8a46;
    }
    #fillBtn:disabled {
      background: #ccc;
      cursor: not-allowed;
    }
    #status {
      margin-top: 10px;
      padding: 10px;
      border-radius: 5px;
      text-align: center;
      font-size: 13px;
      display: none;
    }
    .success { background: #d4edda; color: #155724; }
    .error { background: #f8d7da; color: #721c24; }
    .info { background: #d1ecf1; color: #0c5460; }
    #rowCount {
      text-align: center;
      margin: 10px 0;
      font-size: 14px;
      color: #333;
    }
    #previewContainer {
      display: none;
      margin: 10px 0;
    }
    #previewTable {
      width: 100%;
      border-collapse: collapse;
      font-size: 11px;
      background: white;
    }
    #previewTable th {
      background: #1a73e8;
      color: white;
      padding: 6px 4px;
      position: sticky;
      top: 0;
    }
    #previewTable td {
      padding: 4px;
      border: 1px solid #ddd;
      text-align: center;
      max-width: 60px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    #previewTable td:first-child {
      text-align: left;
      max-width: 80px;
    }
    #previewTable tr:nth-child(even) {
      background: #f9f9f9;
    }
    .table-wrapper {
      max-height: 200px;
      overflow-y: auto;
      border: 1px solid #ddd;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <h3>📋 IRWCMS Auto-Fill</h3>
  
  <div class="upload-area">
    <label class="upload-btn" for="fileInput">Choose Excel/CSV File</label>
    <input type="file" id="fileInput" accept=".xlsx,.xls,.csv">
    <div id="fileName">No file selected</div>
    <div style="font-size: 11px; color: #888; margin-top: 8px;">
      Columns: Particulars, N1, N2, N3, K, Sign, L, B, H<br>
      <em>(Sign = "+" or "-")</em>
    </div>
  </div>
  
  <div id="rowCount"></div>
  
  <div id="previewContainer">
    <div class="table-wrapper">
      <table id="previewTable">
        <thead>
          <tr>
            <th>Particulars</th>
            <th>N1</th>
            <th>N2</th>
            <th>N3</th>
            <th>K</th>
            <th>Sign</th>
            <th>L</th>
            <th>B</th>
            <th>H</th>
          </tr>
        </thead>
        <tbody id="previewBody"></tbody>
      </table>
    </div>
  </div>
  
  <button id="fillBtn" disabled>Fill Form</button>
  
  <div id="status"></div>
  
  <script src="xlsx.full.min.js"></script>
  <script src="popup.js"></script>
</body>
</html>
