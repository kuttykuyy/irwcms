name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    name: Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Run tests
        run: npm test -- --coverage --coverageReporters=text-summary

      - name: Build extension
        run: npm run build

      - name: Verify dist is complete
        run: |
          required=(manifest.json popup.js content.js background.js popup.html translations.js xlsx.full.min.js icon16.png icon48.png icon128.png)
          missing=()
          for f in "${required[@]}"; do
            [ -f "dist/$f" ] || missing+=("$f")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "❌ Missing from dist/: ${missing[*]}"
            exit 1
          fi
          echo "✅ dist/ is complete (${#required[@]} files)"

      - name: Upload dist as artifact
        uses: actions/upload-artifact@v4
        with:
          name: irwcms-extension-v${{ github.run_number }}
          path: dist/
          retention-days: 30
